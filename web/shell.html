<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>__PIECE__ · procedurart</title>
<style>
  :root { color-scheme: dark; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; touch-action: manipulation; }
  #view { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; }
  #gl { display: none; } /* raylib needs a canvas for its GL context; nothing is shown on it */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
    font: 13px var(--mono); color: #fff;
    transition: transform .2s;
  }
  #bar.hidden { transform: translateY(100%); }
  .row { display: flex; gap: 8px; align-items: center; }
  button {
    min-height: 44px; border: 0; border-radius: 14px; padding: 0 6px;
    background: rgba(255,255,255,.22); color: #fff; font: inherit;
    display: inline-flex; align-items: center; justify-content: center;
  }
  button:active { background: rgba(255,255,255,.4); }
  button.on { background: rgba(255,255,255,.5); }
  button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #grid { flex: 1; display: flex; gap: 4px; min-width: 0; }
  #grid button { flex: 1; min-width: 0; padding: 0; font-size: 12px; }
  #pal { display: flex; gap: 6px; padding: 0 10px; height: 44px; align-items: center;
         border-radius: 14px; background: rgba(255,255,255,.22); }
  #pal i { width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box;
           border: 2px solid #fff; background: rgba(255,255,255,.35); }
  #pal i.empty { border: 0; }
  .label { padding: 0 4px 0 6px; font-size: 15px; }
  .main button { flex: 1; font-size: 13px; }
  .main button.icon { flex: none; width: 56px; }
  #busy { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px;
          border-radius: 99px; background: rgba(0,0,0,.6); color: #fff; font: 13px var(--mono); display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="gl" tabindex="-1"></canvas>
<div id="busy">rendering…</div>
<div id="bar">
  <div class="row">
    <div id="grid"></div>
    <div id="pal"></div>
  </div>
  <div class="row">
    <span class="label" id="methodLabel"></span>
    <span id="spawn" class="row" style="gap:8px"></span>
  </div>
  <div class="row main">
    <button id="rand">Rand All</button>
    <button id="pert">Rand Small</button>
    <button id="col">Rand Color</button>
    <button id="png" class="icon" aria-label="Download PNG">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </button>
  </div>
</div>
<script>
  const view = document.getElementById('view');
  const bar = document.getElementById('bar');
  const busy = document.getElementById('busy');
  const ctx = view.getContext('2d');
  let ready = false, grid = 1;

  // web/build.ps1 stamps the piece name. Each piece names its switchable method (the
  // piece's spawner hooks) and gives one icon per option, in the order the piece lists them.
  const PIECE = '__PIECE__';
  const METHODS = {
    signrec: { label: 'Spawn:', icons: [
      '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/><rect x="8" y="8" width="8" height="8"/></svg>', // rectangles
      '<svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/></svg>',                                              // lines
    ] },
    gridpath: { label: 'Grid:', icons: [
      '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/></svg>',                                        // square
      '<svg viewBox="0 0 24 24"><polygon points="12,2.5 20.2,7.25 20.2,16.75 12,21.5 3.8,16.75 3.8,7.25"/></svg>',        // hexagon
    ] },
    spideye: { label: '', icons: [] },
  }[PIECE] || { label: 'Method:', icons: [] };
  document.getElementById('methodLabel').textContent = METHODS.label;

  // Physical pixels of the screen, capped so huge displays stay fast.
  function screenPx() {
    const dpr = window.devicePixelRatio || 1;
    let w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    const k = Math.min(1, 2800 / Math.max(w, h));
    return [Math.round(w * k), Math.round(h * k)];
  }

  function show() {
    const w = Module._web_out_w(), h = Module._web_out_h();
    const ptr = Module._web_pixels();
    const px = new Uint8ClampedArray(Module.HEAPU8.buffer, ptr, w * h * 4).slice();
    view.width = w; view.height = h;
    ctx.putImageData(new ImageData(px, w, h), 0, 0);
    refreshControls();
  }

  // Palette swatches (foregrounds, then background, then empty slots up to 5) and the
  // active spawn method.
  function refreshControls() {
    const pal = document.getElementById('pal');
    pal.textContent = '';
    const n = Module._web_palette_count();
    for (let i = 0; i < 5; i++) {
      const s = document.createElement('i');
      if (i < n) s.style.background = '#' + Module._web_palette_color(i).toString(16).padStart(6, '0');
      else s.className = 'empty';
      pal.appendChild(s);
    }
    const cur = Module._web_spawner();
    [...document.getElementById('spawn').children].forEach((b, i) => b.classList.toggle('on', i === cur));
  }

  // Run a state change, repainting after the "rendering…" badge has had a chance to appear.
  function act(fn) {
    if (!ready) return;
    busy.textContent = 'rendering…';
    busy.style.display = 'block';
    setTimeout(() => {
      try { fn(); show(); busy.style.display = 'none'; }
      catch (e) { busy.textContent = 'error: ' + (e && e.message || e); console.error(e); }
    }, 20);
  }

  const gridRow = document.getElementById('grid');
  for (let n = 1; n <= 5; n++) {
    const b = document.createElement('button');
    b.textContent = n + 'x' + n;
    if (n === grid) b.classList.add('on');
    b.onclick = () => {
      grid = n;
      [...gridRow.children].forEach((c, i) => c.classList.toggle('on', i + 1 === n));
      act(() => Module._web_set_grid(n));
    };
    gridRow.appendChild(b);
  }
  document.getElementById('rand').onclick = () => act(() => Module._web_randomize_all());
  document.getElementById('pert').onclick = () => act(() => Module._web_perturb());
  document.getElementById('col').onclick = () => act(() => Module._web_randomize_colors());
  document.getElementById('png').onclick = () => {
    if (!ready || !Module._web_save_png()) return;
    const data = Module.FS.readFile('/art.png');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'image/png' }));
    a.download = 'procedurart-' + Date.now() + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  // Tap the art to hide/show the controls.
  view.onclick = () => bar.classList.toggle('hidden');

  let resizeTimer;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => act(() => { const [w, h] = screenPx(); Module._web_resize(w, h); Module._web_set_grid(grid); }), 250);
  });

  var Module = {
    canvas: document.getElementById('gl'),
    // Stamped by web/build.ps1 so a new page never runs with an old cached .wasm.
    locateFile: (p) => p + '?v=__BUILD__',
    onRuntimeInitialized() {
      ready = true;
      // Runs after main() has created the piece (onRuntimeInitialized fires before it).
      act(() => {
        const spawn = document.getElementById('spawn');
        for (let i = 0; i < Module._web_spawner_count(); i++) {
          const b = document.createElement('button');
          b.style.width = '56px';
          b.innerHTML = METHODS.icons[i] || String(i + 1);
          b.onclick = () => act(() => Module._web_set_spawner(i));
          spawn.appendChild(b);
        }
        const [w, h] = screenPx();
        Module._web_resize(w, h);
        Module._web_randomize_all();
      });
    },
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
